<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تهيئة مالك TORANEX</title><link rel="stylesheet" href="admin.css"></head><body><header><a class="admin-brand" href="index.html">TORANEX <small>OWNER SETUP</small></a><a href="index.html">العودة للموقع</a></header><main><section class="login"><p class="eyebrow">ONE-TIME SECURE SETUP</p><h1>تهيئة حساب المالك</h1><p>استخدم البريد الذي أنشأت له حساباً مسبقاً في Firebase Authentication، ثم أدخل سر التهيئة الذي أضفته مؤقتاً في Vercel.</p><form id="setup"><label>بريد حساب المالك<input name="email" type="email" required autocomplete="email"></label><label>سر التهيئة المؤقت<input name="secret" type="password" required autocomplete="off"></label><button class="primary">تفعيل صلاحية المالك</button><p id="status" class="status" aria-live="polite"></p></form><p>بعد نجاح العملية، احذف متغير TORANEX_BOOTSTRAP_SECRET من Vercel وأعد النشر. هذه الصفحة لا تحفظ السر.</p></section></main><script>document.querySelector("#setup").addEventListener("submit",async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector("button"),s=document.querySelector("#status"),d=new FormData(f);b.disabled=true;s.textContent="جارٍ تهيئة الحساب…";try{const r=await fetch("/api/bootstrap-owner",{method:"POST",headers:{"Content-Type":"application/json","x-bootstrap-secret":d.get("secret")},body:JSON.stringify({email:d.get("email")})}),j=await r.json();if(!r.ok)throw Error(j.error||"تعذر التهيئة");s.textContent="تم تفعيل حساب المالك بنجاح. احذف سر التهيئة من Vercel الآن ثم أعد النشر.";f.reset();}catch(x){s.textContent=x.message;}finally{b.disabled=false;}});</script></body></html>
