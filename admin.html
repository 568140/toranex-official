<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة إدارة TORANEX</title><link rel="stylesheet" href="admin.css"></head><body><header><a class="admin-brand" href="index.html">TORANEX <small>CONTROL ROOM</small></a><a href="index.html">العودة للموقع ↗</a></header><main><section id="login" class="login"><p class="eyebrow">PRIVATE ADMINISTRATION</p><h1>إدارة TORANEX</h1><p>سجّل الدخول بحساب المالك أو حساب إداري معتمد.</p><form id="login-form"><label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">دخول لوحة التحكم</button><p id="login-status" class="status" aria-live="polite"></p></form></section><section id="dashboard" hidden><div class="dash-head"><div><p class="eyebrow">TORANEX / ADMIN</p><h1>مساحة الإدارة</h1><span id="who"></span></div><button id="logout" class="outline">تسجيل الخروج</button></div><div id="stats" class="stats"></div><nav class="tabs"><button data-tab="projects" class="active">المشاريع</button><button data-tab="services">الخدمات</button><button data-tab="messages">الرسائل</button><button data-tab="settings">بيانات الشركة</button><button data-tab="seo">SEO</button><button data-tab="media">الوسائط</button><button data-tab="audit">سجل النشاط</button></nav><section class="panel" id="panel-projects"><div class="panel-head"><h2>معرض الأعمال</h2><button class="primary" id="new-project">إضافة مشروع +</button><button class="outline" id="seed-projects">استيراد المشاريع الأولية</button></div><form id="project-form" class="editor" hidden><input name="id" type="hidden"><div class="fields"><label>اسم المشروع<input name="name" required></label><label>التصنيف<input name="category" required></label><label class="wide">رابط المشروع<input name="url" type="url" required></label><label class="wide">رابط صورة المعاينة<input name="imageUrl" type="url"></label><label class="wide">وصف المشروع<textarea name="description" required></textarea></label><label>السنة<input name="year" type="number"></label><label>العميل<input name="client"></label><label>دورك<input name="role"></label><label>ترتيب العرض<input name="order" type="number" value="0"></label><label class="check"><input name="published" type="checkbox" checked> منشور للعامة</label><label class="check"><input name="featured" type="checkbox"> مشروع مميز</label></div><div class="actions"><button class="primary">حفظ المشروع</button><button type="button" class="outline" data-cancel="project-form">إلغاء</button></div></form><div id="project-list" class="records"></div></section><section class="panel" id="panel-services" hidden><div class="panel-head"><h2>الخدمات</h2><button class="primary" id="new-service">إضافة خدمة +</button><button class="outline" id="seed-services">استيراد الخدمات الأساسية</button></div><form id="service-form" class="editor" hidden><input name="id" type="hidden"><div class="fields"><label>اسم الخدمة<input name="name" required></label><label>العنوان الفرعي<input name="subtitle"></label><label class="wide">الوصف<textarea name="description"></textarea></label><label>الأيقونة<input name="icon"></label><label>ترتيب العرض<input name="order" type="number" value="0"></label><label class="check"><input name="active" type="checkbox" checked> مفعّلة</label></div><div class="actions"><button class="primary">حفظ الخدمة</button><button type="button" class="outline" data-cancel="service-form">إلغاء</button></div></form><div id="service-list" class="records"></div></section><section class="panel" id="panel-messages" hidden><div class="panel-head"><h2>طلبات التواصل</h2><button class="outline" id="refresh-messages">تحديث</button></div><div id="message-list" class="records"></div></section><section class="panel" id="panel-settings" hidden><h2>بيانات الشركة والمؤسس</h2><form id="settings-form" class="editor"><div class="fields"><label>اسم العلامة<input name="siteName"></label><label>العبارة التعريفية<input name="tagline"></label><label>رقم الهاتف<input name="phone"></label><label>البريد الإلكتروني<input name="email" type="email"></label><label>الموقع<input name="location"></label><label>رابط واتساب<input name="whatsapp" type="url"></label><label>Instagram<input name="instagram" type="url"></label><label>Telegram<input name="telegram" type="url"></label><label>Facebook<input name="facebook" type="url"></label><label class="wide">نبذة الشركة والمؤسس<textarea name="about"></textarea></label><label class="wide">رابط الشعار<input name="logoUrl" type="url"></label><label class="wide">رابط الأيقونة<input name="faviconUrl" type="url"></label></div><button class="primary">حفظ بيانات الشركة</button></form></section><section class="panel" id="panel-seo" hidden><h2>إعدادات محركات البحث</h2><form id="seo-form" class="editor"><div class="fields"><label class="wide">عنوان الموقع<input name="title"></label><label class="wide">الوصف التعريفي<textarea name="description"></textarea></label><label class="wide">الكلمات المفتاحية<input name="keywords"></label><label class="wide">رابط الصورة الاجتماعية<input name="ogImage" type="url"></label><label class="wide">الرابط الأساسي<input name="canonicalUrl" type="url"></label></div><button class="primary">حفظ إعدادات SEO</button></form></section><section class="panel" id="panel-media" hidden><div class="panel-head"><h2>مكتبة الوسائط</h2></div><form id="upload-form" class="editor"><label>رفع صورة أو PDF (حتى 2.5MB)<input type="file" name="file" accept="image/jpeg,image/png,image/webp,application/pdf" required></label><button class="primary">رفع إلى Supabase</button><p id="upload-status" class="status"></p></form><div id="media-list" class="media-grid"></div></section><section class="panel" id="panel-audit" hidden><h2>سجل النشاط الإداري</h2><div id="audit-list" class="records"></div></section></section></main><script type="module" src="admin.js"></script></body></html>
