<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة إدارة TORANEX</title><link rel="stylesheet" href="admin.css"><script src="firebase-config.js"></script></head><body><header><a href="index.html">TORANEX / CONTROL ROOM</a><a href="index.html">العودة للموقع ↗</a></header><main><section id="login"><p>PRIVATE ADMINISTRATION</p><h1>تسجيل الدخول</h1><form id="login-form"><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة المرور<input name="password" type="password" required></label><button>دخول لوحة التحكم</button><p id="status"></p></form></section><section id="dashboard" hidden><div class="dash-head"><div><p>TORANEX / ADMIN</p><h1>مساحة الإدارة</h1><span id="who"></span></div><button id="logout">تسجيل الخروج</button></div><div class="tabs"><button data-tab="projects">المشاريع</button><button data-tab="messages">رسائل التواصل</button></div><section id="projects"><h2>إدارة المشاريع</h2><button id="add">إضافة مشروع +</button><form id="project-form" hidden><input name="id" type="hidden"><label>اسم المشروع<input name="name" required></label><label>الرابط<input name="url" type="url" required></label><label>التصنيف<input name="category" required></label><label>الوصف<textarea name="description" required></textarea></label><label><input type="checkbox" name="published" checked> منشور</label><button>حفظ</button><button type="button" id="cancel">إلغاء</button></form><div id="project-list"></div></section><section id="messages" hidden><h2>رسائل التواصل</h2><div id="message-list"></div></section></section></main><script type="module" src="admin.js"></script></body></html>
